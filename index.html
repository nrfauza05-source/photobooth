<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture Club by nrfauza</title>
    
    <!-- Font imut & aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <!-- Library untuk download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Fredoka', cursive;
            background-color: #f7d6e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #4a4a4a;
        }

        h1 {
            margin-bottom: 10px;
            font-weight: 600;
            color: #ef476f;
            text-shadow: 2px 2px #ffffff;
        }

        /* PERBAIKAN UTAMA: Kamera & Hasil Foto tidak akan ketarik lagi */
        .camera-container {
            width: 320px;
            height: 240px;
            border: 6px dashed #ffffff;
            border-radius: 20px;
            overflow: hidden;
            background-color: #000;
            position: relative;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Memotong otomatis pinggiran kamera agar proporsi wajah pas */
            transform: scaleX(-1); /* Efek cermin biar alami */
        }

        .buttons {
            margin: 20px 0;
            display: flex;
            gap: 10px;
        }

        button {
            background-color: #ef476f;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-family: 'Fredoka', cursive;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        button.secondary {
            background-color: #118ab2;
        }

        /* Frame Photo Strip ala Korea (2x6 inci proporsional) */
        .photo-strip {
            width: 160px;
            background-color: #ffffff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border-radius: 4px;
        }

        .photo-frame {
            width: 100%;
            height: 110px;
            background-color: #eee;
            overflow: hidden;
            border-radius: 2px;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Memotong hasil jepretan foto agar tidak gepeng */
        }

        .watermark {
            text-align: center;
            font-size: 11px;
            color: #a3a3a3;
            font-weight: 600;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        #canvas-hidden {
            display: none;
        }
    </style>
</head>
<body>

    <h1>📸 Capture Club</h1>
    
    <div class="camera-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <div class="buttons">
        <button id="capture-btn">Ambil Foto</button>
        <button id="switch-btn" class="secondary">Balik Kamera</button>
        <button id="download-btn" class="secondary" style="background-color: #06d6a0; display: none;">Simpan</button>
    </div>

    <!-- Tampilan Frame Strip -->
    <div class="photo-strip" id="strip-container">
        <div class="photo-frame"><img id="img1" src="" alt=""></div>
        <div class="photo-frame"><img id="img2" src="" alt=""></div>
        <div class="photo-frame"><img id="img3" src="" alt=""></div>
        <div class="watermark">CAPTURE CLUB</div>
    </div>

    <!-- Tempat memproses gambar di balik layar -->
    <canvas id="canvas-hidden"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const captureBtn = document.getElementById('capture-btn');
        const switchBtn = document.getElementById('switch-btn');
        const downloadBtn = document.getElementById('download-btn');
        const canvas = document.getElementById('canvas-hidden');
        const ctx = canvas.getContext('2d');

        let currentStream = null;
        let useFrontCamera = true;
        let photoCount = 0;
        const images = [document.getElementById('img1'), document.getElementById('img2'), document.getElementById('img3')];

        // Fungsi menyalakan kamera dengan rasio aman
        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: useFrontCamera ? "user" : "environment",
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: false
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
            } catch (error) {
                alert("Gagal mengakses kamera. Pastikan izin sudah diberikan ya!");
            }
        }

        // Ambil Foto dengan pemotongan cerdas (biar gak ketarik)
        captureBtn.addEventListener('click', () => {
            if (photoCount >= 3) {
                // Reset kalau sudah 3 foto
                photoCount = 0;
                images.forEach(img => img.src = "");
                downloadBtn.style.display = "none";
            }

            // Atur canvas internal sesuai ukuran video asli
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Efek mirror di canvas jika pakai kamera depan
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (useFrontCamera) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Kembalikan efek mirror setelah gambar digambar
            if (useFrontCamera) {
                ctx.setTransform(1, 0, 0, 1, 0, 0);
            }

            // Masukkan ke frame
            const dataURL = canvas.toDataURL('image/png');
            images[photoCount].src = dataURL;
            photoCount++;

            if (photoCount === 3) {
                downloadBtn.style.display = "inline-block";
                alert("3 Foto selesai diambil! Klik 'Simpan' untuk mendownload strip fotomu.");
            }
        </script>
</body>
</html>
